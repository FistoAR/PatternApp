<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/Logo/logo-icon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/fontawesome.min.css">
    <link rel="stylesheet" href="./css/solid.min.css">
    <link rel="stylesheet" href="./css/regular.min.css">
    <link rel="stylesheet" href="./css/svg-with-js.min.css">
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="./styles/nav.css" />
    <link rel="stylesheet" href="./styles/left_sidebar.css" />
    <link rel="stylesheet" href="./styles/right_sidebar.css" />
    <link rel="stylesheet" href="./styles/maincontent.css" />
    <script type="module" src="./js/model-viewer.min.js"></script>
    <script src="./js/fabric.min.js"></script>
    <link rel="stylesheet" href="./css/nano.min.css">
    <script src="./js/pickr.min.js"></script>
    <title>TerraTechPacks 3D</title>
  </head>
  <body>
    <div class="main" id="main">
      <nav class="nav">
        <div>
          <img
            src="./assets/Logo/terratechpacks_white.png"
            alt="TerraTech_logo"
            class="nav_logo"
          />
        </div>
        <div class="nav_links">
          <a class="login_btn" href="exportpdf.html">Mock up Generator</a>
          <a class="login_btn" href="login.html">Login</a>
        </div>
      </nav>
      <div class="content">
        <div class="left_side_bar">
          <p>Select Pattern</p>
          <div class="pattern_box">
            <div class="pattern_list">
              <ul class="accordion" id="patternAccordion">
                <!-- category is injucted from js -->
              </ul>
            </div>
          </div>
          <p>Upload Logo</p>
          <div class="upload_box">
            <label for="logoUpload" class="upload-box" id="dropArea">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <p style="margin-top: 10px">Upload Logo Here</p>
              <input type="file" id="logoUpload" accept="image/*" />
            </label>
            <button class="edit_btn">Edit</button>
          </div>
          <!-- Modal -->
          <div id="editModal" class="modal">
            <div class="modal-content">
              <div class="modal_header">
                <span class="close-button"
                  ><i class="fa-solid fa-xmark"></i
                ></span>
                <h3>Edit Logo</h3>
              </div>
              <div class="modal_body" id="model_body">
                <div
                  id="previewWrapper"
                  style="
                    position: relative;
                    width: 100%;
                    height: 100%;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    overflow: hidden;
                  "
                >
                  <!-- Loader -->
                  <div
                    id="previewLoader"
                    style="
                      display: none;
                      position: absolute;
                      top: 50%;
                      left: 50%;
                      transform: translate(-50%, -50%);
                      z-index: 10;
                    "
                  >
                    <div class="loader"></div>
                  </div>
                  <!-- Fabric canvas for drawing -->
                  <canvas id="fabricCanvas"></canvas>
                </div>
              </div>
              <div class="modal_footer">
                <button id="saveLogoBtn" class="save_btn">Save</button>
                <label for="uploadBtn" class="upload_btn">Upload Logo</label>
                <input
                  type="file"
                  id="uploadBtn"
                  name="file"
                  hidden
                  accept="image/png"
                />
              </div>
            </div>
          </div>

          <!-- Confirm Modal -->
          <div id="confirmModal" class="modal">
            <div class="modal-content" style="height: auto; width: 30vw; min-width: 300px; padding: 2vw;">
              <div class="modal_header" style="height: auto; border-bottom: 0.1vw solid #eee; padding-bottom: 1vw; margin-bottom: 1vw;">
                <h3 id="confirmTitle" style="margin: 0; font-size: 1.25vw;">Confirm Action</h3>
              </div>
              <div class="modal_body" style="height: auto; padding: 1.5vw 0; text-align: center; display: block;">
                <p id="confirmMessage" style="font-size: 1vw; color: #333; margin: 0; line-height: 1.5;">Your edited pattern will be lost. Are you sure you want to switch models?</p>
              </div>
              <div class="modal_footer" style="height: auto; display: flex; justify-content: flex-end; gap: 1vw; margin-top: 1vw;">
                <button id="confirmCancelBtn" class="save_btn" style="background-color: #f1f1f1; color: #333; box-shadow: none;">Cancel</button>
                <button id="confirmOkBtn" class="save_btn">Confirm</button>
              </div>
            </div>
          </div>
        </div>
        <div class="main_content">
          <div class="model" id="modelcontainer">
            <div
              style="
                height: 10%;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                padding: 0 1.5vw;
              "
            >
              <!-- Left: Auto Apply Pattern & Hide Logo -->
              <div style="position: absolute; left: 1.5vw; display: flex; align-items: center; gap: 1vw;">
                <div style="display: flex; align-items: center; gap: 0.5vw;">
                  <span style="font-size: 0.85vw; font-weight: 500; color: #333;">Auto Apply Pattern</span>
                  <label class="rotate-switch">
                    <input type="checkbox" id="autoApplyToggle" checked>
                    <span class="rotate-slider"></span>
                  </label>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5vw;">
                  <span style="font-size: 0.85vw; font-weight: 500; color: #333;">Hide Logo</span>
                  <label class="rotate-switch">
                    <input type="checkbox" id="hideLogoToggle">
                    <span class="rotate-slider"></span>
                  </label>
                </div>
              </div>

              <!-- Center: Model Name -->
              <h3 id="mainModelTitle" style="margin: 0;">120ml Round Container</h3>

              <!-- Right: Auto Rotate -->
              <div style="position: absolute; right: 1.5vw; display: flex; align-items: center; gap: 0.5vw;">
                <span style="font-size: 0.85vw; font-weight: 500; color: #333;">Auto Rotate</span>
                <label class="rotate-switch">
                  <input type="checkbox" id="autoRotateToggle" checked>
                  <span class="rotate-slider"></span>
                </label>
              </div>
            </div>
            <div class="model_view">
              <model-viewer
                id="mainViewer"
                src="./assets/Model_with_logo/120ml round with logo.glb"
                alt="120ml Round Container"
                camera-controls
                auto-rotate
                auto-rotate-delay="0"
                exposure="1"
                rotation-per-second="60deg"
                shadow-intensity="1"
                disable-tap
                disable-pan
                ar
                interaction-prompt="none"
              >
              </model-viewer>
            </div>
          </div>

          <div class="model_file">
            <!-- Part Selection & Colors -->
            <div class="footer-section part-controls">
              <select id="partSelect" class="styled-select">
                <option selected value="lid">Lid</option>
                <option value="tub">Tub</option>
              </select>
              <div id="colorOptions" class="color-options">
                <!-- Dynamic radio buttons -->
              </div>
              <div id="partColorPickerTrigger" class="custom-color-picker">
                <img src="./assets/pngwing.png" alt="Custom Part Color" title="Choose Custom Color" />
                <div id="partColorPicker" style="display:none;"></div>
              </div>
            </div>

            <!-- Background Setup -->
            <div class="footer-section bg-controls">
              <label>Background:</label>
              <div id="bgColorPickerTrigger" class="custom-color-picker">
                <img src="./assets/pngwing.png" alt="Background Color" title="Change Environment Background" />
                <div id="bgColorPicker" style="display: none;"></div>
              </div>
            </div>

            <!-- Export Options -->
            <div class="footer-section export-controls">
              <select id="exportFormat" class="styled-select">
                <option value="png">PNG</option>
                <option value="jpg">JPG</option>
                <option value="pdf">PDF</option>
              </select>
              <button id="exportBtn" class="primary-btn">Export</button>
            </div>
          </div>
        </div>
        <div class="Right_side_bar">
          <p>Select Model</p>
          <!-- thumbnails -->
          <div class="thumbs">
            <ul class="accordion" id="modelAccordion">
              <!-- models injected by JS -->
            </ul>
          </div>
        </div>
      </div>
      <!-- Preloader Spinner -->
      <div id="preloader">
        <video id="preloaderVideo" autoplay muted loop playsinline>
          <source src="./assets/Preloader/Terrapack.webm" type="video/webm">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
    <script src="./js/jspdf.umd.min.js"></script>
    <script src="model.js"></script>
  </body>
</html>
